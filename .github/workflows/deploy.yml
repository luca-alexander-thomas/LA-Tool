name: Deploy

# Deployt nur beim Veröffentlichen eines GitHub-Releases (keine Vorabversionen).
# Pull-Requests und Pushes deployen nicht; sie laufen nur durch die CI (ci.yml).
on:
  release:
    types:
      - published

# Erforderliche GitHub-Secrets (Settings → Secrets → Actions, Environment "production"):
#
#   SSH_HOST      – Hostname oder IP-Adresse des Servers
#   SSH_USER      – SSH-Benutzername (root, weil deploy.sh systemd-Timer einspielt)
#   SSH_KEY       – Inhalt des privaten SSH-Schlüssels
#   SSH_PORT      – SSH-Port (optional, Standard: 22)
#   DEPLOY_PATH   – Projektverzeichnis auf dem Server (/home/compose/la-tool)

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4          # checkt den Release-Tag aus
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
        env: { DEBUG: "True" }
      - run: python manage.py test
        env: { DEBUG: "True" }

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: test          # nur deployen, wenn die Tests grün sind
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - name: Release-Daten vorbereiten
        id: release
        # Werte nur über env, nie direkt ins Skript einsetzen (Release-Texte könnten Shell-Code enthalten)
        env:
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          URL: ${{ github.event.release.html_url }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'; then
            echo "Ungültiger Tag-Name: $TAG"; exit 1
          fi
          payload=$(jq -n --arg tag "$TAG" --arg name "$NAME" --arg body "$BODY" \
                          --arg published_at "$PUBLISHED_AT" --arg url "$URL" \
                          '{tag: $tag, name: $name, body: $body, published_at: $published_at, url: $url}' | base64 -w0)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Auf Server deployen
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_JSON_B64: ${{ steps.release.outputs.payload }}
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          port:     ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          envs: RELEASE_TAG,RELEASE_JSON_B64
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # Tag zuerst auschecken, damit die Skripte des Releases selbst laufen
            git fetch --force --tags origin
            git checkout --detach "refs/tags/$RELEASE_TAG"
            bash deploy/release.sh "$RELEASE_TAG" "$RELEASE_JSON_B64"
