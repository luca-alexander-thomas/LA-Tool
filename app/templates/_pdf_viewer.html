{% if question.file %}
<section class="card p-2 sm:p-3">
    <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-0.5">
            <button type="button" id="pdf-prev" class="btn btn-ghost btn-icon size-11" disabled title="Vorherige Seite" aria-label="Vorherige Seite">{% include "icons/chevron-left.html" with cls="size-5" %}</button>
            <span id="pdf-page-info" class="min-w-16 text-center text-sm text-ink-2 tabular-nums">— / —</span>
            <button type="button" id="pdf-next" class="btn btn-ghost btn-icon size-11" disabled title="Nächste Seite" aria-label="Nächste Seite">{% include "icons/chevron-right.html" with cls="size-5" %}</button>
        </div>
        <div class="flex items-center gap-0.5">
            <button type="button" id="pdf-zoom-out" class="btn btn-ghost btn-icon size-11 text-lg" title="Verkleinern" aria-label="Verkleinern">&#8722;</button>
            <button type="button" id="pdf-zoom-in" class="btn btn-ghost btn-icon size-11 text-lg" title="Vergrößern" aria-label="Vergrößern">&#43;</button>
            <button type="button" id="pdf-fs-open" class="btn btn-ghost btn-icon size-11" title="Vollbild" aria-label="Vollbild">
                <svg class="size-4" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M1.5 1h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 1M10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5M.5 10a.5.5 0 0 1 .5.5v4c0 .276.224.5.5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5m15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5"/>
                </svg>
            </button>
            <a href="{{ question.file.url }}" download class="btn btn-soft btn-icon size-11" title="Herunterladen" aria-label="Herunterladen">{% include "icons/arrow-down-tray.html" with cls="size-5" %}</a>
        </div>
    </div>
    <div id="pdf-scroll" class="max-h-[62vh] overflow-auto rounded-xl bg-surface-2">
        <canvas id="pdf-canvas" class="mx-auto block"></canvas>
    </div>
    <p id="pdf-error" class="form-error hidden">PDF konnte nicht geladen werden.</p>
</section>

<!-- Fullscreen overlay -->
<div id="pdf-fs-overlay" class="fixed inset-0 z-[70] hidden flex-col bg-black/90" role="dialog" aria-modal="true" aria-label="PDF Vollbild">
    <div class="flex shrink-0 flex-wrap items-center justify-between gap-2 bg-neutral-900 px-2 pt-[calc(0.5rem+env(safe-area-inset-top))] pb-2 text-white sm:px-3">
        <div class="flex items-center gap-0.5">
            <button type="button" id="pdf-fs-prev" class="btn btn-icon size-11 text-white hover:bg-white/10" disabled title="Vorherige Seite" aria-label="Vorherige Seite">{% include "icons/chevron-left.html" with cls="size-5" %}</button>
            <span id="pdf-fs-page-info" class="min-w-16 text-center text-sm text-white/60 tabular-nums">— / —</span>
            <button type="button" id="pdf-fs-next" class="btn btn-icon size-11 text-white hover:bg-white/10" disabled title="Nächste Seite" aria-label="Nächste Seite">{% include "icons/chevron-right.html" with cls="size-5" %}</button>
        </div>
        <div class="flex items-center gap-0.5">
            <button type="button" id="pdf-fs-zoom-out" class="btn btn-icon size-11 text-lg text-white hover:bg-white/10" title="Verkleinern" aria-label="Verkleinern">&#8722;</button>
            <button type="button" id="pdf-fs-zoom-in" class="btn btn-icon size-11 text-lg text-white hover:bg-white/10" title="Vergrößern" aria-label="Vergrößern">&#43;</button>
            <a href="{{ question.file.url }}" download class="btn btn-icon size-11 text-white hover:bg-white/10" title="Herunterladen" aria-label="Herunterladen">{% include "icons/arrow-down-tray.html" with cls="size-5" %}</a>
            <button type="button" id="pdf-fs-close" class="btn btn-icon ml-1 size-11 bg-white/10 text-white hover:bg-white/20" title="Schließen" aria-label="Schließen">{% include "icons/x-mark.html" with cls="size-5" %}</button>
        </div>
    </div>
    <div id="pdf-fs-scroll" class="flex flex-1 items-start justify-center overflow-auto bg-neutral-700 p-3 sm:p-5">
        <canvas id="pdf-canvas-fs" class="block shadow-[0_6px_32px_rgb(0_0_0/0.6)]"></canvas>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
<script>
(function () {
    const FILE_URL = "{{ question.file.url }}";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const canvas     = document.getElementById('pdf-canvas');
    const ctx        = canvas.getContext('2d');
    const canvasFs   = document.getElementById('pdf-canvas-fs');
    const ctxFs      = canvasFs.getContext('2d');
    const scroll     = document.getElementById('pdf-scroll');
    const scrollFs   = document.getElementById('pdf-fs-scroll');
    const pageInfo   = document.getElementById('pdf-page-info');
    const pageInfoFs = document.getElementById('pdf-fs-page-info');
    const btnPrev    = document.getElementById('pdf-prev');
    const btnNext    = document.getElementById('pdf-next');
    const btnZoomIn  = document.getElementById('pdf-zoom-in');
    const btnZoomOut = document.getElementById('pdf-zoom-out');
    const btnFsOpen  = document.getElementById('pdf-fs-open');
    const overlay    = document.getElementById('pdf-fs-overlay');
    const btnFsPrev  = document.getElementById('pdf-fs-prev');
    const btnFsNext  = document.getElementById('pdf-fs-next');
    const btnFsZoomIn  = document.getElementById('pdf-fs-zoom-in');
    const btnFsZoomOut = document.getElementById('pdf-fs-zoom-out');
    const btnFsClose   = document.getElementById('pdf-fs-close');
    const errMsg     = document.getElementById('pdf-error');

    let pdf = null, page = 1, scale = null, scaleFs = null;
    let taskSmall = null, taskFs = null;

    function fitScale(pdfPage, container) {
        const vp = pdfPage.getViewport({ scale: 1 });
        const w  = Math.max(container.clientWidth - 8, 200);
        return w / vp.width;
    }

    async function renderSmall(num) {
        page = num;
        if (taskSmall) { taskSmall.cancel(); taskSmall = null; }
        const p  = await pdf.getPage(num);
        if (scale === null) scale = fitScale(p, scroll);
        const vp = p.getViewport({ scale });
        canvas.width  = vp.width;
        canvas.height = vp.height;
        taskSmall = p.render({ canvasContext: ctx, viewport: vp });
        try { await taskSmall.promise; } catch (e) {
            if (e?.name !== 'RenderingCancelledException') console.warn(e);
        }
        updateNav();
    }

    async function renderFs(num) {
        page = num;
        if (taskFs) { taskFs.cancel(); taskFs = null; }
        const p = await pdf.getPage(num);
        if (scaleFs === null) scaleFs = fitScale(p, scrollFs);
        const vp = p.getViewport({ scale: scaleFs });
        canvasFs.width  = vp.width;
        canvasFs.height = vp.height;
        taskFs = p.render({ canvasContext: ctxFs, viewport: vp });
        try { await taskFs.promise; } catch (e) {
            if (e?.name !== 'RenderingCancelledException') console.warn(e);
        }
        updateNav();
    }

    function updateNav() {
        const n = pdf ? pdf.numPages : 0;
        pageInfo.textContent   = `${page} / ${n || '—'}`;
        pageInfoFs.textContent = `${page} / ${n || '—'}`;
        btnPrev.disabled   = page <= 1;
        btnNext.disabled   = !pdf || page >= pdf.numPages;
        btnFsPrev.disabled = page <= 1;
        btnFsNext.disabled = !pdf || page >= pdf.numPages;
    }

    function isFsOpen() {
        return !overlay.classList.contains('hidden');
    }

    function openFs() {
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        document.body.style.overflow = 'hidden';
        scaleFs = null;
        renderFs(page);
    }

    function closeFs() {
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        document.body.style.overflow = '';
        if (taskFs) { taskFs.cancel(); taskFs = null; }
    }

    pdfjsLib.getDocument(FILE_URL).promise.then(doc => {
        pdf = doc;
        renderSmall(1);
    }).catch(() => { errMsg.classList.remove('hidden'); });

    btnPrev.addEventListener('click',    () => { if (page > 1) renderSmall(page - 1); });
    btnNext.addEventListener('click',    () => { if (pdf && page < pdf.numPages) renderSmall(page + 1); });
    btnZoomIn.addEventListener('click',  () => { scale = (scale ?? 1) * 1.25; renderSmall(page); });
    btnZoomOut.addEventListener('click', () => { scale = Math.max((scale ?? 1) / 1.25, 0.25); renderSmall(page); });

    btnFsOpen.addEventListener('click',  openFs);
    btnFsClose.addEventListener('click', closeFs);
    btnFsPrev.addEventListener('click',  () => { if (page > 1) renderFs(page - 1); });
    btnFsNext.addEventListener('click',  () => { if (pdf && page < pdf.numPages) renderFs(page + 1); });
    btnFsZoomIn.addEventListener('click',  () => { scaleFs = (scaleFs ?? 1) * 1.25; renderFs(page); });
    btnFsZoomOut.addEventListener('click', () => { scaleFs = Math.max((scaleFs ?? 1) / 1.25, 0.25); renderFs(page); });

    overlay.addEventListener('click', e => { if (e.target === overlay || e.target === scrollFs) closeFs(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && isFsOpen()) closeFs(); });
})();
</script>
{% else %}
<section class="card">
    <p class="empty-state m-2 border-0">Kein PDF hochgeladen.</p>
</section>
{% endif %}
