{% extends "base.html" %}

{% block site_content %}

    <div class="container py-4 py-xl-5">
        <div class="row mb-5">
            <div class="col-md-8 col-xl-6 text-center mx-auto">
                <h2>Katalog LA-Bronze</h2>
                <p>Inhalte bearbeiten</p>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-md-12 p-2">
                <div class="border rounded-1 border-2 border-primary d-flex flex-row justify-content-center align-items-center p-2 mb-2">
                    <form class="d-flex w-100 align-items-center">
                        <div class="col"><label class="form-label d-flex align-items-center">Name<input class="form-control w-75 ms-2" type="text" name="catalog-name" placeholder="Katalog Name"></label><label class="form-label d-flex align-items-center">Kurztitel<input class="form-control w-75 ms-2" type="text" name="catalog-shortname" placeholder="Katalog Kurztitel"></label></div>
                        <div class="col"><label class="form-label d-flex align-items-center">LA-Stufe<br><select class="form-select d-flex w-75 ms-2">
                                    <optgroup label="LA-Stufen">
                                        <option value="10" selected="">Bronze</option>
                                        <option value="11">Silber</option>
                                        <option value="12">This is Gold</option>
                                    </optgroup>
                                </select></label><label class="form-label d-flex align-items-center">Icon<input class="form-control w-75 ms-2" type="file"></label>
                            <div class="d-flex justify-content-end"><button class="btn btn-primary d-flex" type="submit">Speichern</button></div>
                        </div>
                    </form>
                </div>
                <div class="border rounded-1 border-2 border-primary d-flex flex-column justify-content-center align-items-end p-2">
                    <div class="w-100">
                        <ul class="nav nav-tabs" role="tablist">
                            <li class="nav-item" role="presentation"><a class="nav-link" role="tab" data-bs-toggle="tab" href="#tab-1">Theorie</a></li>
                            <li class="nav-item" role="presentation"><a class="nav-link" role="tab" data-bs-toggle="tab" href="#tab-2">Praxis</a></li>
                            <li class="nav-item" role="presentation"><a class="nav-link active" role="tab" data-bs-toggle="tab" href="#tab-3">Gruppenaufgaben</a></li>
                        </ul>
                        <div class="tab-content">
                            <div class="tab-pane" role="tabpanel" id="tab-1">
                                <div id="div-questions-1">
                                    <div class="border rounded-1 border-1 border-secondary w-100 p-2 mt-2"><input class="w-25 pt-0 mb-2" type="text" placeholder="Nummer"><input class="w-100 mb-2" type="text" placeholder="Frage" name="question"><textarea class="w-100" placeholder="Hinweise / Hilfe"></textarea>
                                        <div id="answer-div-1">
                                            <div class="d-flex flex-row align-items-center mt-2">
                                                <div class="col col-xl-1 d-flex justify-content-center"><span class="answer-letter">A</span></div>
                                                <div class="col"><input class="w-100" type="text"></div>
                                                <div class="col col-xl-1 text-danger d-flex justify-content-center align-items-center" onclick="deleteAnswer(this)"><svg class="bi bi-dash-circle-fill" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16" style="font-size: 23px;">
                                                        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M4.5 7.5a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1z"></path>
                                                    </svg></div>
                                            </div>
                                        </div>
                                        <div class="d-flex justify-content-center mt-2" onclick="addAnswer(this)"><svg class="bi bi-plus-circle text-success" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16" style="font-size: 23px;">
                                                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"></path>
                                                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"></path>
                                            </svg></div><button class="btn btn-primary text-bg-danger border-danger" type="button" onclick="deleteQuestion(this)">Löschen</button>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-center m-2"><button class="btn btn-primary d-flex align-items-center" type="button" onclick="addQuestion(this)"><svg class="bi bi-plus-lg me-2" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16">
                                            <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"></path>
                                        </svg>Hinzufügen</button></div>
                            </div>
                            <div class="tab-pane" role="tabpanel" id="tab-2">
                                <div id="div-tasks">
                                    <div class="border rounded-1 border-1 border-secondary d-flex flex-column align-items-start p-2 mb-2"><input class="w-25 mb-2 pb-0" type="text" placeholder="Nummer"><input class="w-100 mb-2" type="text" placeholder="Aufgabe"><textarea class="w-100 mb-2" placeholder="Beschreibung"></textarea><textarea class="w-100 mb-2" placeholder="Hinweise"></textarea><label class="form-label">Aufgabe PDF&nbsp;<input type="file"></label><button class="btn btn-primary text-bg-danger border-danger" type="button" onclick="deleteQuestion(this)">Löschen</button></div>
                                </div>
                                <div class="d-flex justify-content-center"><button class="btn btn-primary d-flex align-items-center" type="button" onclick="addExercise(this)"><svg class="bi bi-plus-lg me-2" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16">
                                            <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"></path>
                                        </svg>Hinzufügen</button></div>
                            </div>
                            <div class="tab-pane active" role="tabpanel" id="tab-3">
                                <div id="div-tasks-1">
                                    <div class="border rounded-1 border-1 border-secondary d-flex flex-column align-items-start p-2 mb-2"><input class="w-25 mb-2 pb-0" type="text" placeholder="Nummer"><input class="w-100 mb-2" type="text" placeholder="Aufgabe"><textarea class="w-100 mb-2" placeholder="Beschreibung"></textarea><textarea class="w-100 mb-2" placeholder="Hinweise"></textarea><label class="form-label">Aufgabe PDF&nbsp;<input type="file"></label><button class="btn btn-primary text-bg-danger border-danger" type="button" onclick="deleteQuestion(this)">Löschen</button></div>
                                </div>
                                <div class="d-flex justify-content-center"><button class="btn btn-primary d-flex align-items-center" type="button" onclick="addExercise(this)"><svg class="bi bi-plus-lg me-2" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16">
                                            <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2"></path>
                                        </svg>Hinzufügen</button></div>
                            </div>
                        </div>
                    </div><button class="btn btn-primary mt-3" type="button">Speichern</button>
                </div>
            </div>
        </div>
    </div>
 {% endblock %}
