{% extends "base.html" %}

{% block site_content %}
<div class="container py-4" style="max-width:640px;">
    <div class="mb-3">
        <a href="{% url 'admin_catalog' %}" class="text-decoration-none text-muted">&larr; Alle Kataloge</a>
    </div>
    <h4 class="mb-4">{{ title }}</h4>
    <div class="border rounded-2 border-primary p-4">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}
            </div>
            {% endfor %}
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{% url 'admin_catalog' %}" class="btn btn-outline-secondary">Abbrechen</a>
                <button type="submit" class="btn btn-primary">Speichern</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
